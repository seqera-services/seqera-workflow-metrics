[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seqera-workflow-metrics"
version = "0.2.0"
description = "Collect and analyze workflow metrics from Seqera Platform"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
    "typer>=0.9",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "ruff>=0.9",
    "mypy>=1.0",
    "types-requests",
    "pandas-stubs",
    "pre-commit>=3.0",
]

[project.scripts]
seqera-workflow-metrics = "seqera_workflow_metrics.cli:app"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
